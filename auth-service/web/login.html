<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 视频剪辑工作台</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
    }
    .card {
      width: 340px; padding: 32px 28px; border-radius: 16px;
      background: rgba(30, 41, 59, 0.85);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .sub { margin: 0 0 24px; font-size: 13px; color: #94a3b8; }
    label { display: block; font-size: 13px; margin: 14px 0 6px; color: #cbd5e1; }
    input[type=text], input[type=password] {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: #e2e8f0; font-size: 14px;
    }
    input:focus { outline: 2px solid #6366f1; border-color: transparent; }
    .row { display: flex; align-items: center; gap: 8px; margin: 16px 0 22px; font-size: 13px; }
    .row input { accent-color: #6366f1; }
    button {
      width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
      background: #6366f1; color: #fff; font-size: 15px; font-weight: 600;
    }
    button:hover { background: #4f46e5; }
    button:disabled { opacity: .6; cursor: default; }
    .err { min-height: 18px; margin-top: 12px; font-size: 13px; color: #f87171; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <h1>视频剪辑工作台</h1>
    <p class="sub">请使用管理员分配的账号登录</p>
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus />
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <div class="row">
      <input id="remember" type="checkbox" checked />
      <label for="remember" style="margin:0;">记住我（30 天）</label>
    </div>
    <button id="submit" type="submit">登录</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    // Only allow same-origin relative redirect targets (avoid open-redirect).
    function safeNext() {
      const p = new URLSearchParams(location.search).get("next");
      if (p && p.startsWith("/") && !p.startsWith("//")) return p;
      return "/";
    }
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const btn = document.getElementById("submit");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
            remember: document.getElementById("remember").checked,
          }),
        });
        if (res.ok) {
          location.href = safeNext();
        } else {
          const body = await res.json().catch(() => ({}));
          err.textContent = body.detail || "登录失败，请重试";
        }
      } catch (_) {
        err.textContent = "网络错误，请重试";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
