<!-- video-edit-ai: unified cross-navigation. Injected into claudecodeui's
     index.html after </div id=root> so it lives OUTSIDE React's root and is
     never re-rendered/removed by the SPA. Links are top-level navigations to
     sibling apps served behind the same gateway + single login. -->
<style>
  #veai-nav{position:fixed;left:12px;bottom:12px;z-index:2147483000;display:flex;
    gap:6px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
  #veai-nav a{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;
    background:rgba(30,41,59,.92);color:#e2e8f0;font-size:13px;text-decoration:none;
    border:1px solid #334155;box-shadow:0 4px 14px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
  #veai-nav a:hover{background:#334155}
  #veai-nav a.hidden{display:none}
</style>
<div id="veai-nav">
  <a href="/files" title="文件管理">📁 文件</a>
  <a href="/admin" id="veai-admin" class="hidden" title="账号管理">👤 账号</a>
  <a href="#" id="veai-logout" title="退出登录">⏻ 退出</a>
</div>
<script>
  (function () {
    // Show the admin link only to admins; hide silently if auth endpoints are
    // unavailable (e.g. dev-agent run without the gateway).
    fetch("/api/auth/me", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && d.user && d.user.is_admin) {
          document.getElementById("veai-admin").classList.remove("hidden");
        }
      })
      .catch(function () {});
    document.getElementById("veai-logout").addEventListener("click", function (e) {
      e.preventDefault();
      fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" })
        .finally(function () { window.location.href = "/login"; });
    });
  })();
</script>
